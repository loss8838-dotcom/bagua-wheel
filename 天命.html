<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>古風八卦五行方位命運轉盤</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            /* 🛠️ 圈圈以外完全還原純黑，沒有任何背景圖騰與雜紋 */
            background-color: #141414;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }

        h1 {
            color: #ffd700;
            margin-bottom: 25px;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.5), 0 2px 4px rgba(0,0,0,0.8);
            font-size: 22px;
            letter-spacing: 2px;
            text-align: center;
            z-index: 10;
        }

        /* 轉盤大容器，固定尺寸防止被壓縮 */
        .wheel-container {
            position: relative;
            width: 320px !important;
            height: 320px !important;
            margin-bottom: 40px;
            z-index: 10;
        }

        /* 正上方紅色指針 */
        .pointer {
            position: absolute;
            top: -15px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 15px solid transparent;
            border-right: 15px solid transparent;
            border-top: 30px solid #ff4444;
            z-index: 40;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.6));
        }

        /* 轉盤主體：字圖合一，同步旋轉 */
        .wheel-main {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 6px solid #ffd700;
            position: absolute;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0,0,0,0.7);
            /* 啟動 3D 渲染加速 */
            transform: translate3d(0, 0, 0) rotate(0deg);
            transition: transform 4s cubic-bezier(0.1, 0.8, 0.25, 1);
            will-change: transform;
            /* 8卦區域底色色塊 */
            background: conic-gradient(
                #fff0f2 0deg 45deg, #fafaf0 45deg 90deg, #f0f4f8 90deg 135deg,
                #f7f7f7 135deg 180deg, #ebf5ff 180deg 225deg, #fff7eb 225deg 270deg,
                #effaf0 270deg 315deg, #e6fcf5 315deg 360deg
            );
        }

        /* 文字與五行節點：嵌入轉盤內部同步旋轉 */
        .node-item {
            position: absolute;
            width: 90px;
            left: 50%;
            top: 25px;
            margin-left: -45px;
            text-align: center;
            transform-origin: center 135px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            z-index: 10;
        }
        
        .txt-bagua { font-size: 14px; font-weight: bold; color: #111; }
        .txt-dir { font-size: 11px; color: #555; }
        
        /* 五行小標籤 */
        .txt-wuxing {
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 4px;
            color: #fff;
            font-weight: bold;
        }
        .wx-fire { background-color: #ff4444; }
        .wx-earth { background-color: #b8860b; }
        .wx-gold { background-color: #daa520; color: #000; }
        .wx-water { background-color: #44aaff; }
        .wx-wood { background-color: #2e8b57; }

        /* 太極圓心 */
        .center-taiji {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 50px;
            height: 50px;
            background: #fff;
            border: 3px solid #ffd700;
            border-radius: 50%;
            z-index: 20;
            background: linear-gradient(to right, #000 50%, #fff 50%);
        }
        .center-taiji::before { content: ''; position: absolute; top: 0; left: 50%; transform: translateX(-50%); width: 22px; height: 22px; background: #000; border-radius: 50%; }
        .center-taiji::after { content: ''; position: absolute; bottom: 0; left: 50%; transform: translateX(-50%); width: 22px; height: 22px; background: #fff; border-radius: 50%; }
        
        /* 開始按鈕 */
        .spin-btn {
            background: linear-gradient(135deg, #ffd700, #b8860b);
            color: #000;
            border: 2px solid #fff;
            padding: 14px 60px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(255, 215, 0, 0.4);
            z-index: 10;
        }
        .spin-btn:active { transform: scale(0.95); }
    </style>
</head>
<body>

    <h1>☯️ 八卦五行方位之輪 ☯️</h1>

    <div class="wheel-container">
        <!-- 指針 -->
        <div class="pointer"></div>
        
        <!-- 轉盤主體 -->
        <div class="wheel-main" id="wheelMain">
            <!-- 內嵌八卦、五行與方位文字 -->
            <div class="node-item" style="transform: rotate(22.5deg);">
                <span class="txt-bagua">離（火）</span><span class="txt-dir">正南方</span><span class="txt-wuxing wx-fire">火</span>
            </div>
            <div class="node-item" style="transform: rotate(67.5deg);">
                <span class="txt-bagua">坤（地）</span><span class="txt-dir">西南方</span><span class="txt-wuxing wx-earth">土</span>
            </div>
            <div class="node-item" style="transform: rotate(112.5deg);">
                <span class="txt-bagua">兌（澤）</span><span class="txt-dir">正西方</span><span class="txt-wuxing wx-gold">金</span>
            </div>
            <div class="node-item" style="transform: rotate(157.5deg);">
                <span class="txt-bagua">乾（天）</span><span class="txt-dir">西北方</span><span class="txt-wuxing wx-gold">金</span>
            </div>
            <div class="node-item" style="transform: rotate(202.5deg);">
                <span class="txt-bagua">坎（水）</span><span class="txt-dir">正北方</span><span class="txt-wuxing wx-water">水</span>
            </div>
            <div class="node-item" style="transform: rotate(247.5deg);">
                <span class="txt-bagua">艮（山）</span><span class="txt-dir">東北方</span><span class="txt-wuxing wx-earth">土</span>
            </div>
            <div class="node-item" style="transform: rotate(292.5deg);">
                <span class="txt-bagua">震（雷）</span><span class="txt-dir">正東方</span><span class="txt-wuxing wx-wood">木</span>
            </div>
            <div class="node-item" style="transform: rotate(337.5deg);">
                <span class="txt-bagua">巽（風）</span><span class="txt-dir">東南方</span><span class="txt-wuxing wx-wood">木</span>
            </div>
        </div>

        <!-- 太極圓心 -->
        <div class="center-taiji"></div>
    </div>

    <button class="spin-btn" id="spinBtn" onclick="spinWheel()">啟動天機</button>

    <script>
        const baguaList = [
            { bagua: "離（火）", dir: "正南方", wuxing: "火", tip: "離火光明！今日南方大吉，五行屬火助旺熱情，好運即將降臨。" },
            { bagua: "坤（地）", dir: "西南方", wuxing: "土", tip: "坤地厚德！五行屬土包容萬物，今天是個適合默默耕耘的好日子。" },
            { bagua: "兌（澤）", dir: "正西方", wuxing: "金", tip: "兌澤喜悅！五行屬金剛毅明亮，適合聚會，西方將有喜事發生。" },
            { bagua: "乾（天）", dir: "西北方", wuxing: "金", tip: "乾天剛健！自強不息，五行屬金銳不可擋，今日運勢如日中天！" },
            { bagua: "坎（水）", dir: "正北方", wuxing: "水", tip: "坎水行險！五行屬水智謀深遠，此時前方宜多看少動，凡事理智應對。" },
            { bagua: "艮（山）", dir: "東北方", wuxing: "土", tip: "艮山時止！不宜躁進，五行屬土沉穩厚實，適度休息能走更長遠的路。" },
            { bagua: "震（雷）", dir: "正東方", wuxing: "木", tip: "震雷驚動！臨危不亂，五行屬木充滿生機，雖有小突發狀況但能化險為夷。" },
            { bagua: "巽（風）", dir: "東南方", wuxing: "木", tip: "巽風柔順！五行屬木隨風滋長，多聽取身邊朋友或長輩意見能迎刃而解。" }
        ];

        const wheelMain = document.getElementById('wheelMain');
        const spinBtn = document.getElementById('spinBtn');
        
        let currentRotation = 0;
        let isSpinning = false;

        function spinWheel() {
            if (isSpinning) return;
            isSpinning = true;
            spinBtn.disabled = true;

            const randomDegrees = Math.floor(Math.random() * 360);
            const totalDegrees = currentRotation + (360 * 6) + randomDegrees;
            currentRotation = totalDegrees;

            // 運用 3D 硬體加速同步旋轉
            wheelMain.style.transform = `translate3d(0, 0, 0) rotate(${totalDegrees}deg)`;

            setTimeout(() => {
                isSpinning = false;
                spinBtn.disabled = false;

                const stoppedAngle = (totalDegrees % 360);
                const targetIndex = Math.floor(((360 - stoppedAngle) % 360) / 45);
                const result = baguaList[targetIndex];

                alert(`🔮 命運大轉盤指示：\n\n【 命定卦象 】：${result.bagua} ─ ${result.dir}\n【 五行歸屬 】：五行屬【 ${result.wuxing} 】\n\n☯️ 運勢解籤：${result.tip}`);
            }, 4000);
        }
    </script>
</body>
</html>
